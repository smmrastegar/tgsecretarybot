name: Site Monitor (browser scrape)

# Runs a real browser to scrape JS-SPA report pages the Vercel cron
# can't render, then POSTs the text to the app for AI analysis.
# Times are UTC. 09:30 & 11:30 UTC = 13:00 & 15:00 Tehran (UTC+3:30).
# Days 0,1,2,3,6 = Sun,Mon,Tue,Wed,Sat  → skips Thursday(4) & Friday(5).
on:
  schedule:
    - cron: "30 9,11 * * 0,1,2,3,6"
  workflow_dispatch: {}   # manual run button

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm i -D playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Scrape & ingest
        env:
          SITE_LOGIN_URL: ${{ secrets.SITE_LOGIN_URL }}
          SITE_CHECK_URL: ${{ secrets.SITE_CHECK_URL }}
          SITE_USER: ${{ secrets.SITE_USER }}
          SITE_PASS: ${{ secrets.SITE_PASS }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.SITE_MONITOR_INGEST_SECRET }}
          MONITOR_NAME: ${{ secrets.MONITOR_NAME }}
        run: node scripts/site-monitor-scrape.mjs
