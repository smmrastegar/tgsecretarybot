name: iOS app

# Compile check on every change to ios/ (no Apple account needed), and an optional
# signed build uploaded to TestFlight when you run it by hand with the Apple secrets set.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight (needs the APPLE_* secrets)"
        type: boolean
        default: false

defaults:
  run:
    shell: bash   # adds pipefail, so a failing xcodebuild is not hidden by `| tail`

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Compile for the simulator (unsigned)
        run: |
          cd ios
          xcodebuild -project MyMusic.xcodeproj -scheme MyMusic -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 30

  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    needs: build
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        run: |
          for v in TEAM KEY_ID ISSUER KEY_P8; do [ -n "${!v}" ] || { echo "::error::missing secret for $v (APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8)"; exit 1; }; done
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM\"/" project.yml
          xcodegen generate
      - name: Archive (automatic signing through the App Store Connect API key)
        run: |
          mkdir -p ~/private_keys && printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          cd ios
          xcodebuild archive -project MyMusic.xcodeproj -scheme MyMusic -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MyMusic.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 30
      - name: Export and upload to TestFlight
        run: |
          cd ios
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MyMusic.xcarchive -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 30
